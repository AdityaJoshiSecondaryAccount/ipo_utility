<style>
    /* Keep this shared modal identical across pages with different Bootstrap CSS. */
    #combinedTransferModal .modal-dialog {
        width: 90% !important;
        max-width: 90% !important;
        margin: 1.75rem auto !important;
    }
    #combinedTransferModal .modal-body {
        padding: 1rem !important;
        overflow-x: hidden !important;
    }
    #combinedTransferModal .table-responsive {
        margin-top: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: hidden !important;
        white-space: normal !important;
    }
    #combinedTransferModal table.table {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        border-collapse: collapse !important;
        table-layout: fixed !important;
        white-space: normal !important;
    }
    #combinedTransferModal table.table th,
    #combinedTransferModal table.table td {
        padding: 0.45rem 0.5rem !important;
        border: 1px solid #dee2e6 !important;
        text-align: left !important;
        vertical-align: middle !important;
        color: #212529 !important;
        font-size: 0.875rem !important;
    }
    #combinedTransferModal table.table th {
        white-space: nowrap !important;
    }
    #combinedTransferModal table.table td {
        white-space: nowrap !important;
    }
    #combinedTransferModal table.table td:first-child {
        white-space: normal !important;
        overflow-wrap: anywhere !important;
    }
    #combinedTransferModal table.table th:nth-child(1) { width: 22% !important; }
    #combinedTransferModal table.table th:nth-child(2) { width: 22% !important; }
    #combinedTransferModal table.table th:nth-child(3) { width: 27% !important; }
    #combinedTransferModal table.table th:nth-child(4) { width: 17% !important; }
    #combinedTransferModal table.table th:nth-child(5) { width: 12% !important; }
    #combinedTransferModal table.table thead th {
        background-color: rgb(182, 182, 158) !important;
        font-weight: 700 !important;
    }
    #combinedTransferModal table.table tbody td {
        background-color: #fff !important;
        font-weight: 400 !important;
    }
    #combinedTransferModal .form-control {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        height: auto !important;
        border: 1px solid #d1d3e2 !important;
        border-radius: 0.35rem !important;
        padding: 0.375rem 0.75rem !important;
        font-size: 0.9rem !important;
        background-clip: padding-box !important;
    }
    #combinedTransferModal input[type="checkbox"] {
        accent-color: #0d6efd;
    }
    #combinedTransferModal input[type="checkbox"]:not(:disabled) {
        cursor: pointer;
    }
    #combinedTransferModal table.table .form-control {
        min-height: 2rem !important;
        padding: 0.25rem 0.35rem !important;
        font-size: 0.82rem !important;
        line-height: 1.35 !important;
    }
    #combinedTransferModal table.table th:last-child,
    #combinedTransferModal table.table td:last-child {
        padding-left: 0.3rem !important;
        padding-right: 0.3rem !important;
        text-align: center !important;
    }
    #combinedTransferModal .ct-validation-banner {
        display: none;
        margin-top: 1rem;
        margin-bottom: 0;
        padding: 0.75rem 1rem;
        border: 1px solid #f5c2c7;
        border-radius: 0.35rem;
        background-color: #f8d7da;
        color: #842029;
        white-space: normal !important;
    }
    @media (max-width: 767.98px) {
        #combinedTransferModal .modal-dialog {
            width: calc(100% - 1rem) !important;
            max-width: calc(100% - 1rem) !important;
            margin: 0.5rem auto !important;
        }
    }
</style>

<div class="modal fade" id="combinedTransferModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <form id="combinedTransferForm">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Multiple IPO Transfer</h5>
                    <button type="button" class="btn-close" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="ct_mode" value="ipo">

                    <div class="row">
                        <div class="col-md-6">
                            <h6>Source</h6>
                            <div class="form-group">
                                <label for="ct_source_group">Group Name</label>
                                <select id="ct_source_group" class="form-control" required>
                                    <option value="" selected disabled>Select group</option>
                                    {% if groups1 %}
                                        {% for group in groups1 %}<option value="{{ group.id }}">{{ group.GroupName }}</option>{% endfor %}
                                    {% else %}
                                        {% for group in groups %}<option value="{{ group.id }}">{{ group.GroupName }}</option>{% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                            <div class="form-group">
                                <div class="text-muted">IPOs will be selected automatically from this group.</div>
                                <select id="ct_source_ipos" multiple hidden disabled></select>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <h6>Destination</h6>
                            <div class="form-group">
                                <label for="ct_destination_group">Group Name</label>
                                <select id="ct_destination_group" class="form-control" required>
                                    <option value="" selected disabled>Select group</option>
                                    {% if groups1 %}
                                        {% for group in groups1 %}<option value="{{ group.id }}">{{ group.GroupName }}</option>{% endfor %}
                                    {% else %}
                                        {% for group in groups %}<option value="{{ group.id }}">{{ group.GroupName }}</option>{% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                            <div class="form-group" id="ct_destination_ipo_group">
                                <div class="text-muted">IPOs will be selected automatically from this group.</div>
                                <select id="ct_destination_ipos" multiple hidden disabled></select>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-2 align-items-end">
                        <div class="col-md-4 form-group">
                            <label for="ct_source_type">Source Amount Type</label>
                            <select id="ct_source_type" class="form-control">
                                <option value="credit">Credit</option>
                                <option value="debit">Debit</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="ct_amount">Transfer Amount</label>
                            <input type="number" id="ct_amount" class="form-control" min="1" step="1" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>Destination Amount Type</label>
                            <input type="text" id="ct_destination_type" class="form-control" value="Debit" readonly>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-8 form-group">
                            <label for="ct_remark">Remark</label>
                            <input type="text" id="ct_remark" class="form-control" maxlength="250">
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="ct_date_time">Date &amp; Time</label>
                            <input type="datetime-local" id="ct_date_time" class="form-control" step="1" required>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-6">
                            <h6>Source Allocation</h6>
                            <div id="ct_source_allocations" class="table-responsive"></div>
                        </div>
                        <div class="col-md-6">
                            <h6>Destination Allocation</h6>
                            <div id="ct_destination_allocations" class="table-responsive"></div>
                        </div>
                    </div>

                    <div id="ct_validation_message" class="ct-validation-banner" role="alert"></div>

                    <div class="row mt-3 p-3" style="background:#e9ecef; border:1px solid #dee2e6;">
                        <div class="col-md-3">Master: <strong id="ct_master_total">0.00</strong></div>
                        <div class="col-md-3">Source: <strong id="ct_source_total">0.00</strong></div>
                        <div class="col-md-3">Destination: <strong id="ct_destination_total">0.00</strong></div>
                        <div class="col-md-3"><span id="ct_status" class="text-danger">Select transfer details</span></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" id="ct_save" disabled>Save Transfer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(function () {
    const modal = $('#combinedTransferModal');
    const form = $('#combinedTransferForm');
    const ipoRequests = {source: null, destination: null};
    let allocationInputError = '';
    let editingBatchId = null;
    let editState = null;
    let pendingEditSides = new Set();

    function toMinorUnits(value) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.round(number * 100) : 0;
    }

    function getCookie(name) {
        const prefix = name + '=';
        const cookie = document.cookie.split(';').map(function (value) {
            return value.trim();
        }).find(function (value) {
            return value.indexOf(prefix) === 0;
        });
        return cookie ? decodeURIComponent(cookie.substring(prefix.length)) : null;
    }

    function selectedIPOs(selector) {
        return $(selector).find('option:selected').map(function () {
            return {
                id: String(this.value),
                name: $(this).text(),
                due: Number($(this).attr('data-due')) || 0
            };
        }).get();
    }

    function dueType(item) {
        return item.due < 0 ? 'debit' : 'credit';
    }

    function matchingIPOs(selector, amountType) {
        return selectedIPOs(selector).filter(function (item) {
            return dueType(item) === amountType;
        });
    }

    function showValidation(message) {
        $('#ct_validation_message').text(message || '').toggle(!!message);
    }

    function loadGroupIPOs(side) {
        const groupSelector = side === 'source' ? '#ct_source_group' : '#ct_destination_group';
        const ipoSelector = side === 'source' ? '#ct_source_ipos' : '#ct_destination_ipos';
        const groupId = $(groupSelector).val();
        const select = $(ipoSelector);

        if (ipoRequests[side]) ipoRequests[side].abort();
        select.empty().prop('disabled', true);
        renderAllocations();
        if (!groupId) return;

        select.append($('<option>', {disabled: true}).text('Loading IPOs...'));
        let url = "{% url 'get_transfer_group_ipos' 0 %}".replace('/0/', '/' + encodeURIComponent(groupId) + '/');
        if (editingBatchId) {
            url += '?exclude_batch=' + encodeURIComponent(editingBatchId);
        }
        const request = $.ajax({
            url: url,
            method: 'GET',
            success: function (response) {
                select.empty();
                (response.data || []).forEach(function (ipo) {
                    select.append($('<option>', {
                        value: ipo.ipo_id,
                        'data-due': ipo.due_amount,
                        selected: true
                    }).text(ipo.ipo_name));
                });
                if (!response.data || !response.data.length) {
                    select.append($('<option>', {disabled: true}).text('No IPOs found for this group'));
                }
                select.prop('disabled', true);
                renderAllocations();
                if (editState && pendingEditSides.has(side)) {
                    pendingEditSides.delete(side);
                    if (!pendingEditSides.size) {
                        renderAllocations();
                        editState = null;
                    }
                }
            },
            error: function (xhr, status) {
                if (status !== 'abort') {
                    select.empty().append(
                        $('<option>', {disabled: true}).text('Unable to load IPOs')
                    );
                }
            },
            complete: function () {
                if (ipoRequests[side] === request) ipoRequests[side] = null;
            }
        });
        ipoRequests[side] = request;
    }

    function allocateByDue(total, items, expectedType) {
        let remaining = total;
        return items.map(function (item) {
            const dueType = item.due < 0 ? 'debit' : 'credit';
            let amount = 0;
            if (remaining > 0 && dueType === expectedType) {
                amount = Math.min(Math.abs(toMinorUnits(item.due)), remaining);
                remaining -= amount;
            }
            return {amount: amount, type: dueType};
        });
    }

    function allocationTable(side, items, allocations) {
        const table = $('<table>', {class: 'table table-sm table-bordered mb-0'});
        table.append('<thead><tr><th>IPO</th><th>Original</th><th>Amount</th><th>Type</th><th>Include</th></tr></thead>');
        const body = $('<tbody>');

        if (!items.length) {
            body.append(
                $('<tr>').append(
                    $('<td>', {colspan: 5, class: 'text-center text-muted'}).text(
                        'No ' + expectedTypeLabel(side) + ' IPO balances found for this group. The transfer amount will be added as JV.'
                    )
                )
            );
        }

        items.forEach(function (item, index) {
            const allocation = allocations[index];
            const row = $('<tr>', {
                class: 'ct-entry-row',
                'data-side': side,
                'data-ipo-id': item.id
            });
            row.append($('<td>').text(item.name));
            row.append($('<td>').text('₹' + item.due.toFixed(2)));
            row.append($('<td>').append($('<input>', {
                type: 'number',
                min: '0',
                max: Math.abs(item.due).toFixed(2),
                step: '1',
                class: 'form-control form-control-sm ct-allocation',
                'data-side': side,
                'data-original-limit': Math.abs(item.due).toFixed(2),
                value: (allocation.amount / 100).toFixed(2)
            })));
            const typeSelect = $('<select>', {
                class: 'form-control form-control-sm ct-allocation-type',
                'data-side': side
            });
            typeSelect.append($('<option>', {value: allocation.type}).text(
                allocation.type.charAt(0).toUpperCase() + allocation.type.slice(1)
            ));
            typeSelect.prop('disabled', true);
            row.append($('<td>').append(typeSelect));
            row.append($('<td>').append($('<input>', {
                type: 'checkbox',
                class: 'ct-allocation-include',
                'data-side': side,
                checked: allocation.amount > 0
            })));
            body.append(row);
        });

        const allocated = allocations.reduce(function (sum, item) {
            return sum + item.amount;
        }, 0);
        const expectedType = side === 'source'
            ? $('#ct_source_type').val()
            : ($('#ct_source_type').val() === 'credit' ? 'debit' : 'credit');
        body.append(jvRow(side, Math.max(0, toMinorUnits($('#ct_amount').val()) - allocated), expectedType));

        table.append(body);
        return table;
    }

    function expectedTypeLabel(side) {
        const sourceType = $('#ct_source_type').val() || 'credit';
        const type = side === 'source'
            ? sourceType
            : (sourceType === 'credit' ? 'debit' : 'credit');
        return type.charAt(0).toUpperCase() + type.slice(1);
    }

    function jvRow(side, amount, amountType) {
        const row = $('<tr>', {
            class: 'ct-entry-row ct-jv-row',
            'data-side': side,
            'data-jv': '1'
        });
        row.append($('<td>').append($('<strong>').text('JV Entry')));
        row.append($('<td>').text('Excess'));
        row.append($('<td>').append($('<input>', {
            type: 'number',
            class: 'form-control form-control-sm ct-jv-amount',
            value: (amount / 100).toFixed(2),
            readonly: true
        })));
        row.append($('<td>').append($('<input>', {
            type: 'text',
            class: 'form-control form-control-sm ct-jv-type',
            value: amountType.charAt(0).toUpperCase() + amountType.slice(1),
            'data-value': amountType,
            readonly: true
        })));
        row.append($('<td>').append($('<input>', {
            type: 'checkbox',
            class: 'ct-allocation-include',
            checked: amount > 0,
            disabled: true
        })));
        row.toggle(amount > 0);
        return row;
    }

    function renderAllocations() {
        allocationInputError = '';
        const master = toMinorUnits($('#ct_amount').val());
        const sourceType = $('#ct_source_type').val();
        const destinationType = sourceType === 'credit' ? 'debit' : 'credit';
        const sourceItems = matchingIPOs('#ct_source_ipos', sourceType);
        const sourceAllocations = allocateByDue(master, sourceItems, sourceType);
        $('#ct_source_allocations').empty().append(
            allocationTable('source', sourceItems, sourceAllocations)
        );

        const destinationItems = matchingIPOs('#ct_destination_ipos', destinationType);
        const destinationAllocations = allocateByDue(master, destinationItems, destinationType);
        $('#ct_destination_allocations').empty().append(
            allocationTable('destination', destinationItems, destinationAllocations)
        );
        if (editState) {
            applySavedAllocations('source', editState.source_allocations || []);
            applySavedAllocations('destination', editState.destination_allocations || []);
            recalculateSideJV('source');
            recalculateSideJV('destination');
        }
        calculateTotals();
    }

    function applySavedAllocations(side, savedItems) {
        const savedByIpo = {};
        savedItems.forEach(function (item) {
            savedByIpo[String(item.ipo_id)] = item;
        });
        $(`#combinedTransferModal .ct-entry-row[data-side="${side}"]:not(.ct-jv-row)`).each(function () {
            const saved = savedByIpo[String($(this).attr('data-ipo-id'))];
            $(this).find('.ct-allocation')
                .val(saved ? Number(saved.amount).toFixed(2) : '0.00');
            $(this).find('.ct-allocation-include').prop('checked', !!saved);
        });
    }

    function sideTotals(side) {
        let credit = 0;
        let debit = 0;
        $(`#combinedTransferModal .ct-entry-row[data-side="${side}"]`).each(function () {
            if (!$(this).find('.ct-allocation-include').is(':checked')) return;
            const isJV = $(this).attr('data-jv') === '1';
            const amount = toMinorUnits($(this).find(isJV ? '.ct-jv-amount' : '.ct-allocation').val());
            const type = isJV
                ? $(this).find('.ct-jv-type').attr('data-value')
                : $(this).find('.ct-allocation-type').val();
            if (type === 'credit') credit += amount;
            else debit += amount;
        });
        return {credit: credit, debit: debit, gross: credit + debit, net: credit - debit};
    }

    function recalculateSideJV(side) {
        const master = toMinorUnits($('#ct_amount').val());
        const expectedType = side === 'source'
            ? $('#ct_source_type').val()
            : ($('#ct_source_type').val() === 'credit' ? 'debit' : 'credit');
        const expectedNet = expectedType === 'credit' ? master : -master;
        let ipoCredit = 0;
        let ipoDebit = 0;

        $(`#combinedTransferModal .ct-entry-row[data-side="${side}"]:not(.ct-jv-row)`).each(function () {
            if (!$(this).find('.ct-allocation-include').is(':checked')) return;
            const amount = toMinorUnits($(this).find('.ct-allocation').val());
            if ($(this).find('.ct-allocation-type').val() === 'credit') ipoCredit += amount;
            else ipoDebit += amount;
        });

        const ipoNet = ipoCredit - ipoDebit;
        const ipoGross = ipoCredit + ipoDebit;
        const remainder = expectedNet - ipoNet;
        const row = $(`#combinedTransferModal .ct-jv-row[data-side="${side}"]`);
        const canBalance = ipoGross + Math.abs(remainder) <= master;

        if (remainder !== 0 && canBalance) {
            const jvType = remainder > 0 ? 'credit' : 'debit';
            row.show();
            row.find('.ct-jv-amount').val((Math.abs(remainder) / 100).toFixed(2));
            row.find('.ct-jv-type')
                .val(jvType.charAt(0).toUpperCase() + jvType.slice(1))
                .attr('data-value', jvType);
            row.find('.ct-allocation-include').prop('checked', true);
        } else {
            row.hide();
            row.find('.ct-jv-amount').val('0.00');
            row.find('.ct-allocation-include').prop('checked', false);
        }
    }

    function redistributeSideAllocations(side, changedRow) {
        const master = toMinorUnits($('#ct_amount').val());
        const rows = $(`#combinedTransferModal .ct-entry-row[data-side="${side}"]:not(.ct-jv-row)`);
        const changed = changedRow ? $(changedRow) : $();
        const changedInput = changed.find('.ct-allocation');
        const changedAmount = changed.length
            ? Math.max(0, toMinorUnits(changedInput.val()))
            : 0;
        let remaining = Math.max(0, master - changedAmount);

        if (changed.length) {
            changed.removeAttr('data-manually-excluded');
            changed.find('.ct-allocation-include').prop('checked', changedAmount > 0);
        }

        rows.each(function () {
            const row = $(this);
            if (row.is(changed)) return;

            const input = row.find('.ct-allocation');
            if (row.attr('data-manually-excluded') === '1') {
                input.val('0.00');
                row.find('.ct-allocation-include').prop('checked', false);
                return;
            }
            const limit = toMinorUnits(input.attr('data-original-limit'));
            const amount = Math.min(limit, remaining);
            input.val((amount / 100).toFixed(2));
            row.find('.ct-allocation-include').prop('checked', amount > 0);
            remaining -= amount;
        });
    }

    function allocateRemainderToRow(side, targetRow) {
        const master = toMinorUnits($('#ct_amount').val());
        const target = $(targetRow);
        let allocatedElsewhere = 0;

        $(`#combinedTransferModal .ct-entry-row[data-side="${side}"]:not(.ct-jv-row)`).each(function () {
            const row = $(this);
            if (row.is(target) || !row.find('.ct-allocation-include').is(':checked')) return;
            allocatedElsewhere += toMinorUnits(row.find('.ct-allocation').val());
        });

        const input = target.find('.ct-allocation');
        const limit = toMinorUnits(input.attr('data-original-limit'));
        const amount = Math.min(limit, Math.max(0, master - allocatedElsewhere));
        input.val((amount / 100).toFixed(2));
        target.find('.ct-allocation-include').prop('checked', amount > 0);
    }

    function redistributeAfterExcludedRow(side, excludedRow) {
        const master = toMinorUnits($('#ct_amount').val());
        const excluded = $(excludedRow);
        const rows = $(`#combinedTransferModal .ct-entry-row[data-side="${side}"]:not(.ct-jv-row)`);
        let allocated = 0;
        let passedExcluded = false;

        rows.each(function () {
            const row = $(this);
            if (row.is(excluded)) return;
            if (!row.find('.ct-allocation-include').is(':checked')) return;
            allocated += toMinorUnits(row.find('.ct-allocation').val());
        });

        let remaining = Math.max(0, master - allocated);
        rows.each(function () {
            const row = $(this);
            if (row.is(excluded)) {
                passedExcluded = true;
                return;
            }
            if (!passedExcluded || row.attr('data-manually-excluded') === '1' || remaining <= 0) return;

            const input = row.find('.ct-allocation');
            const current = toMinorUnits(input.val());
            const limit = toMinorUnits(input.attr('data-original-limit'));
            const addition = Math.min(Math.max(0, limit - current), remaining);
            const amount = current + addition;
            input.val((amount / 100).toFixed(2));
            row.find('.ct-allocation-include').prop('checked', amount > 0);
            remaining -= addition;
        });
    }

    function calculateTotals() {
        const master = toMinorUnits($('#ct_amount').val());
        const source = sideTotals('source');
        const destination = sideTotals('destination');
        const sourceCount = $('#ct_source_allocations .ct-allocation-include:checked').length;
        const destinationCount = $('#ct_destination_allocations .ct-allocation-include:checked').length;
        const groupsSelected = $('#ct_source_group').val() && $('#ct_destination_group').val();
        const groupsAreDifferent = $('#ct_source_group').val() !== $('#ct_destination_group').val();
        const expectedSourceNet = $('#ct_source_type').val() === 'credit' ? master : -master;
        const balanced = master > 0 && sourceCount > 0 && destinationCount > 0 &&
            groupsSelected && groupsAreDifferent && source.gross <= master && destination.gross <= master &&
            source.net === expectedSourceNet && destination.net === -expectedSourceNet;

        let validationMessage = '';
        if (!$('#ct_source_group').val()) {
            validationMessage = 'Select a source group.';
        } else if (!$('#ct_destination_group').val()) {
            validationMessage = 'Select a destination group.';
        } else if (!groupsAreDifferent) {
            validationMessage = 'Source and destination groups must be different.';
        } else if (master <= 0) {
            validationMessage = 'Enter a transfer amount greater than zero.';
        } else if (!$('#ct_date_time').val()) {
            validationMessage = 'Select the transfer date and time.';
        } else if (!sourceCount) {
            validationMessage = 'No source allocation is available.';
        } else if (!destinationCount) {
            validationMessage = 'No destination allocation is available.';
        } else if (source.gross > master) {
            validationMessage = 'Source allocation exceeds the transfer amount.';
        } else if (destination.gross > master) {
            validationMessage = 'Destination allocation exceeds the transfer amount.';
        } else if (source.net !== expectedSourceNet) {
            validationMessage = 'Source allocation must equal the transfer amount.';
        } else if (destination.net !== -expectedSourceNet) {
            validationMessage = 'Destination allocation must equal the transfer amount.';
        }

        $('#ct_master_total').text((master / 100).toFixed(2));
        $('#ct_source_total').text((Math.abs(source.net) / 100).toFixed(2));
        $('#ct_destination_total').text((Math.abs(destination.net) / 100).toFixed(2));
        $('#ct_status')
            .toggleClass('text-success', !!balanced)
            .toggleClass('text-danger', !balanced)
            .text(balanced ? 'Allocation matched' : validationMessage || 'Allocation must match');
        showValidation(balanced ? allocationInputError : validationMessage);
        $('#ct_save').prop('disabled', !balanced);
        return !!balanced;
    }

    function updateMode() {
        $('#ct_destination_ipo_group').show();
        $('#ct_destination_ipos').prop('required', true);
        if ($('#ct_destination_group').val()) {
            loadGroupIPOs('destination');
        } else {
            renderAllocations();
        }
    }

    function updateTypes() {
        $('#ct_destination_type').val(
            $('#ct_source_type').val() === 'credit' ? 'Debit' : 'Credit'
        );
        renderAllocations();
    }

    function currentLocalDateTime() {
        const now = new Date();
        const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 19);
    }

    function collectAllocations(side) {
        return $(`#combinedTransferModal tr:has(.ct-allocation[data-side="${side}"])`).map(function () {
            if (!$(this).find('.ct-allocation-include').is(':checked')) return null;
            return {
                ipo_id: $(this).attr('data-ipo-id'),
                amount: Number($(this).find('.ct-allocation').val()).toFixed(2),
                amount_type: $(this).find('.ct-allocation-type').val()
            };
        }).get();
    }

    function collectJV(side) {
        const row = $(`#combinedTransferModal .ct-jv-row[data-side="${side}"]:visible`);
        if (!row.length) return null;
        return {
            amount: Number(row.find('.ct-jv-amount').val()).toFixed(2),
            amount_type: row.find('.ct-jv-type').attr('data-value')
        };
    }

    $('#ct_source_type').on('change', updateTypes);
    $('#ct_amount, #ct_source_ipos, #ct_destination_ipos').on('input change', renderAllocations);
    $('#ct_source_group').on('change', function () { loadGroupIPOs('source'); });
    $('#ct_destination_group').on('change', function () { loadGroupIPOs('destination'); });
    $(document).on('input change', '#combinedTransferModal .ct-allocation, #combinedTransferModal .ct-allocation-type, #combinedTransferModal .ct-allocation-include', function (event) {
        if ($(this).hasClass('ct-allocation-include') && event.type === 'input') return;
        if ($(this).hasClass('ct-allocation') && event.type === 'change') return;

        if ($(this).hasClass('ct-allocation')) {
            const input = $(this);
            const row = input.closest('.ct-entry-row');
            const side = row.attr('data-side');
            const limit = Number($(this).attr('data-original-limit')) || 0;
            const entered = Number($(this).val()) || 0;
            const master = toMinorUnits($('#ct_amount').val());
            let allocatedElsewhere = 0;

            $(`#combinedTransferModal .ct-entry-row[data-side="${side}"]:not(.ct-jv-row)`).each(function () {
                const otherRow = $(this);
                if (otherRow.is(row) || !otherRow.find('.ct-allocation-include').is(':checked')) return;
                allocatedElsewhere += toMinorUnits(otherRow.find('.ct-allocation').val());
            });

            const available = Math.max(0, master - allocatedElsewhere);
            const originalLimit = toMinorUnits(limit);
            const maximum = Math.min(originalLimit, available) / 100;
            allocationInputError = '';
            if (entered < 0) {
                input.val('0.00');
                allocationInputError = 'IPO allocation cannot be negative.';
            } else if (toMinorUnits(entered) > Math.min(originalLimit, available)) {
                input.val(maximum.toFixed(2));
                allocationInputError = originalLimit <= available
                    ? 'IPO allocation cannot exceed its original balance of ₹' + limit.toFixed(2) + '.'
                    : 'IPO allocation cannot exceed the remaining transfer amount of ₹' + maximum.toFixed(2) + '.';
            }
            redistributeSideAllocations(side, row);
        } else if ($(this).hasClass('ct-allocation-include')) {
            allocationInputError = '';
            const row = $(this).closest('.ct-entry-row');
            const side = row.attr('data-side');
            if ($(this).is(':checked')) {
                row.removeAttr('data-manually-excluded');
                allocateRemainderToRow(side, row);
            } else {
                row.attr('data-manually-excluded', '1');
                row.find('.ct-allocation').val('0.00');
                redistributeAfterExcludedRow(side, row);
            }
        } else {
            allocationInputError = '';
        }
        recalculateSideJV($(this).closest('.ct-entry-row').attr('data-side'));
        calculateTotals();
    });

    modal.on('shown.bs.modal', function () {
        if (!$('#ct_date_time').val()) $('#ct_date_time').val(currentLocalDateTime());
        if (!editingBatchId) {
            updateMode();
            updateTypes();
        }
    });

    modal.on('hidden.bs.modal', function () {
        if (ipoRequests.source) ipoRequests.source.abort();
        if (ipoRequests.destination) ipoRequests.destination.abort();
        form[0].reset();
        $('#ct_source_ipos, #ct_destination_ipos').empty().prop('disabled', true);
        $('#ct_source_allocations, #ct_destination_allocations').empty();
        $('#ct_date_time').val('');
        allocationInputError = '';
        editingBatchId = null;
        editState = null;
        pendingEditSides.clear();
        modal.find('.modal-title').text('Multiple IPO Transfer');
        $('#ct_save').text('Save Transfer');
        showValidation('');
        updateMode();
        updateTypes();
    });

    form.on('submit', function (event) {
        event.preventDefault();
        if (!calculateTotals()) return;

        const payload = {
            mode: $('#ct_mode').val(),
            master_amount: $('#ct_amount').val(),
            source_group_id: $('#ct_source_group').val(),
            destination_group_id: $('#ct_destination_group').val(),
            source_type: $('#ct_source_type').val(),
            date_time: $('#ct_date_time').val(),
            remark: $('#ct_remark').val(),
            source_allocations: collectAllocations('source'),
            destination_allocations: collectAllocations('destination'),
            source_jv: collectJV('source'),
            destination_jv: collectJV('destination')
        };
        if (editingBatchId) payload.transfer_batch_id = editingBatchId;

        const button = $('#ct_save');
        const csrfToken = form.find('[name=csrfmiddlewaretoken]').val() ||
            getCookie('csrftoken') || "{{ csrf_token|escapejs }}";
        button.prop('disabled', true).text('Saving...');
        $.ajax({
            url: "{% url 'bulk_transfer_transactions' %}",
            method: 'POST',
            data: JSON.stringify(payload),
            contentType: 'application/json',
            headers: {'X-CSRFToken': csrfToken},
            success: function () { window.location.reload(); },
            error: function (xhr) {
                const message = xhr.responseJSON && xhr.responseJSON.message
                    ? xhr.responseJSON.message
                    : 'Unable to save transfer (HTTP ' + xhr.status + '). Restart the Django server and try again.';
                showValidation(message);
                button.prop('disabled', false).text(editingBatchId ? 'Update Transfer' : 'Save Transfer');
            }
        });
    });

    $(document).on('click', '.bulk-transfer-edit-btn', function () {
        const batchId = String($(this).attr('data-transfer-batch') || '');
        if (!batchId) return;

        $.ajax({
            url: '/api/transfer-batch/' + encodeURIComponent(batchId) + '/',
            method: 'GET',
            success: function (response) {
                const data = response.data || {};
                editingBatchId = data.transfer_batch_id;
                editState = data;
                pendingEditSides = new Set(['source', 'destination']);
                $('#ct_source_group').val(String(data.source_group_id));
                $('#ct_destination_group').val(String(data.destination_group_id));
                $('#ct_source_type').val(data.source_type);
                $('#ct_destination_type').val(data.source_type === 'credit' ? 'Debit' : 'Credit');
                $('#ct_amount').val(Number(data.master_amount).toFixed(2));
                $('#ct_remark').val(data.remark || '');
                $('#ct_date_time').val(data.date_time);
                modal.find('.modal-title').text('Edit Multiple IPO Transfer');
                $('#ct_save').text('Update Transfer');
                loadGroupIPOs('source');
                loadGroupIPOs('destination');
                modal.modal('show');
            },
            error: function (xhr) {
                const message = xhr.responseJSON && xhr.responseJSON.message
                    ? xhr.responseJSON.message : 'Unable to load transfer details.';
                window.alert(message);
            }
        });
    });

    updateMode();
    updateTypes();
});
</script>
