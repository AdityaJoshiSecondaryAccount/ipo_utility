{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Backup Code</title>
    <link rel="stylesheet" href="{% static 'CSS/all.min.css' %}"/>
    <link href="{% static 'CSS/bootstrap.min.css' %}" rel="stylesheet" id="bootstrap-css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: arabic typesetting; }
        body { background: bisque; overflow: hidden; }
        .container { max-width: 440px; padding: 0 20px; margin: 70px auto; }
        .wrapper { width: 100%; background: rgba(0, 0, 0, 0.48); border-radius: 5px; box-shadow: 0px 4px 10px 1px rgba(0, 0, 0, 0.1); }
        .wrapper .title { height: 90px; border-radius: 5px 5px 0 0; color: #fff; font-size: 35px; font-weight: 609; display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: underline; }
        .wrapper form { padding: 30px 25px 25px 25px; }
        .wrapper form .row { height: 45px; margin-bottom: 15px; position: relative; }
        .wrapper form .row input { height: 100%; width: 100%; outline: none; padding-left: 47px; padding-right: 47px; border-radius: 5px; border: 1px solid lightgrey; font-size: 16px; transition: all 0.3s ease; text-transform: uppercase; text-align: center; font-weight: bold; letter-spacing: 2px;}
        form .row input:focus { border-color: #16a085; box-shadow: inset 0px 0px 2px 2px rgba(26, 188, 156, 0.25); }
        .wrapper form .row i { position: absolute; width: 47px; height: 100%; color: #fff; font-size: 18px; background: #5cb85c; border: 1px solid #4cae4c; border-radius: 5px 0 0 5px; display: flex; align-items: center; justify-content: center; }
        .code-boxes-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .code-group {
            display: flex;
            gap: 6px;
        }
        .code-box {
            width: 36px;
            height: 45px;
            outline: none;
            border-radius: 5px;
            border: 1px solid lightgrey;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            background: #fff;
            transition: all 0.2s ease;
            padding: 0;
        }
        .code-box:focus {
            border-color: #16a085;
            box-shadow: inset 0px 0px 2px 2px rgba(26, 188, 156, 0.25);
        }
        .code-dash {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            user-select: none;
            margin: 0 4px;
            line-height: 1;
        }
        @media (max-width: 400px) {
            .code-box {
                width: 30px;
                height: 40px;
                font-size: 17px;
            }
            .code-boxes-wrapper, .code-group {
                gap: 4px;
            }
        }
        .wrapper form .button input { color: #fff; font-size: 20px; font-weight: 500; background: #5cb85c; border: 1px solid green; cursor: pointer; border-radius: 50px; margin: -10px 0; padding-left: 0; padding-right: 0; text-align: center; width: 100%; }
        form .button input:hover { background: green; }
        .fallback-link { text-align: center; margin-top: 20px; display: block; color: white; text-decoration: none; font-size: 18px; }
        .fallback-link:hover { text-decoration: underline; }
        p.desc { color: white; text-align: center; font-size: 18px; margin-bottom: 20px; }
    </style>
</head>
<body>
    {% if messages %}
    <div class="alert alert-danger fixed-top" id="success-alert" style="position:fixed;">
        <button type="button" class="close" data-dismiss="alert">x</button>
        {% for message in messages %}
        <strong>{{message}}</strong><br>
        {% endfor %}
    </div>
    {% endif %} 
    <div class="container">
        <div class="wrapper">
            <div class="title"><span>Backup Code</span></div>
            <form method="post" action="{% url 'verify_backup_code' %}" id="backupCodeForm">
                {% csrf_token %}
                <p class="desc">Enter one of your saved emergency backup codes (e.g. ABCD-1234).</p>
                <div class="code-boxes-wrapper">
                    <div class="code-group">
                        <input type="text" class="code-box" maxlength="1" data-index="0" autofocus autocomplete="off" required>
                        <input type="text" class="code-box" maxlength="1" data-index="1" autocomplete="off" required>
                        <input type="text" class="code-box" maxlength="1" data-index="2" autocomplete="off" required>
                        <input type="text" class="code-box" maxlength="1" data-index="3" autocomplete="off" required>
                    </div>
                    <span class="code-dash">-</span>
                    <div class="code-group">
                        <input type="text" class="code-box" maxlength="1" data-index="4" autocomplete="off" required>
                        <input type="text" class="code-box" maxlength="1" data-index="5" autocomplete="off" required>
                        <input type="text" class="code-box" maxlength="1" data-index="6" autocomplete="off" required>
                        <input type="text" class="code-box" maxlength="1" data-index="7" autocomplete="off" required>
                    </div>
                </div>
                <input type="hidden" name="backup_code" id="backupCodeCombined" required>
                <div class="row button mt-4">
                    <input class="btn-outline-success loginbtn" type="submit" value="Verify & Log In">
                </div>
                <a class="fallback-link" href="{% url 'login' %}">Back to standard login</a>
            </form>
        </div>
    </div>
    <script src="{% static 'JS/jquery.min.js' %}"></script>
    <script src="{% static 'JS/bootstrap.min.js' %}"></script>
    <script>
        $("#success-alert").fadeTo(3000, 500).slideUp(500, function () {
            $("#success-alert").slideUp(500);
        });

        const boxes = Array.from(document.querySelectorAll('.code-box'));
        const form = document.getElementById('backupCodeForm');
        const combinedInput = document.getElementById('backupCodeCombined');

        boxes.forEach((box, index) => {
            box.addEventListener('focus', () => {
                box.select();
            });

            box.addEventListener('keydown', (e) => {
                // If user accidentally types hyphen, jump to next box
                if (e.key === '-' || e.key === '–') {
                    e.preventDefault();
                    if (index < boxes.length - 1) {
                        boxes[index + 1].focus();
                    }
                    return;
                }

                // Handle backspace
                if (e.key === 'Backspace') {
                    if (box.value === '' && index > 0) {
                        e.preventDefault();
                        boxes[index - 1].value = '';
                        boxes[index - 1].focus();
                    }
                    return;
                }

                // Handle arrow keys
                if (e.key === 'ArrowLeft' && index > 0) {
                    e.preventDefault();
                    boxes[index - 1].focus();
                } else if (e.key === 'ArrowRight' && index < boxes.length - 1) {
                    e.preventDefault();
                    boxes[index + 1].focus();
                }
            });

            box.addEventListener('input', (e) => {
                const val = box.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                box.value = val;

                if (val && index < boxes.length - 1) {
                    boxes[index + 1].focus();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                const cleaned = pasteData.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                if (!cleaned) return;

                // Fill from index 0 if cleaned length is 8, or from current box
                const startIdx = (cleaned.length === 8) ? 0 : index;
                for (let i = 0; i < cleaned.length && (startIdx + i) < boxes.length; i++) {
                    boxes[startIdx + i].value = cleaned[i];
                }
                const focusTarget = Math.min(startIdx + cleaned.length, boxes.length - 1);
                boxes[focusTarget].focus();
            });
        });

        form.addEventListener('submit', (e) => {
            const part1 = boxes.slice(0, 4).map(b => b.value.trim().toUpperCase()).join('');
            const part2 = boxes.slice(4, 8).map(b => b.value.trim().toUpperCase()).join('');

            if (part1.length !== 4 || part2.length !== 4) {
                e.preventDefault();
                const firstEmpty = boxes.find(b => !b.value.trim());
                if (firstEmpty) firstEmpty.focus();
                return false;
            }

            combinedInput.value = `${part1}-${part2}`;
        });
    </script>
</body>
</html>
